[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chimera-ids"
version = "1.0.0"
description = "Priority-Ordered Hierarchical Fusion Architecture for DoS/DDoS Detection (IEEE CICN 2026)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Arnav Inamdar" },
    { name = "Kaviish Maniar" },
    { name = "Punam Chaudhari" },
    { name = "Basant Tiwari" }
]
keywords = [
    "intrusion-detection",
    "ddos-mitigation",
    "xgboost",
    "autoencoder",
    "kitsune",
    "network-security",
    "zero-day-detection"
]
dependencies = [
    "pandas>=2.0.3",
    "numpy>=1.25.2",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "torch>=2.0.1",
    "scapy>=2.5.0",
    "psutil>=5.9.0",
    "pyyaml>=6.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.7.0"
]

[project.scripts]
chimera = "run:interactive_menu"
